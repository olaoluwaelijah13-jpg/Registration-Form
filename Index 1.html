<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>
    <H1><em><U>Student Registration Form</U></em></H1>
    <form action="/register" method="post">
        <label for="Fullname">Full Name</label>
        <input type="text" id="Full Name" name="Full Name" placeholder="Enter Your Full Name" required>
        <br>
        <br>

        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="Enter Your Email" required>
        <br>
        <br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Your Password">
        <br>
        <br>
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br>
        <br>
        <label for="country">Select Your Counry</label>
        <select id="country" name="country">
            <option value="Nigeria">Nigeria</option>
            <option value="Ghana">Ghana</option>
            <option value="Kenya">Kenya</option>
            <option value="South Africa">South Africa</option>

        </select>
        <br>
        <br>


        <label for="About Yourself">About Yourself:</label>
        <textarea placeholder="Tell Us a little About Urself"></textarea>
        <br>
        <br>


        <input type="checkbox" id="Terms" NAME="Terms" value="I agree" required>
        <label for="Terms">I agree to the terms and condition</label>
        <br>
        <br>
        <label for="submit">Click to Submit</label><br>
        <input type="submit" value="Register">
    </form>
    <br>
    <br>


    <form action="/search" method="get">
        <label for="search">Search:</label>
        <input type="text" name="search" id="search" placeholder="search...">
        <input type="submit" value="Search">
    </form>
</body>

</html>
